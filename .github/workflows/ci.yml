name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET 10 Build & xUnit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore NuGet packages
        working-directory: backend
        run: dotnet restore H2l.sln

      - name: Build solution
        working-directory: backend
        run: dotnet build H2l.sln --configuration Release --no-restore

      - name: Run xUnit tests (Unit & Integration)
        working-directory: backend
        run: dotnet test H2l.sln --configuration Release --no-build --verbosity normal

      - name: Verify EF Core Migration Bundle
        working-directory: backend
        run: |
          dotnet tool install --global dotnet-ef --version 10.* || dotnet tool install --global dotnet-ef
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations bundle \
            --project src/H2l.Infrastructure/H2l.Infrastructure.csproj \
            --startup-project src/H2l.WebApi/H2l.WebApi.csproj \
            --configuration Release \
            --no-build \
            --output ./efbundle \
            --force

  frontend:
    name: Frontend (Angular PWA Build, Unit & Cypress)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint --if-present

      - name: Build production PWA
        working-directory: frontend
        run: npm run build

      - name: Run unit tests
        working-directory: frontend
        run: npm test

      - name: Run Cypress E2E tests
        working-directory: frontend
        run: |
          npx ng serve --host localhost --port 4200 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 60); do
            if curl -sSf http://localhost:4200 >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl -sSf http://localhost:4200 >/dev/null
          xvfb-run --auto-servernum npm run cy:run

  openapi-check:
    name: OpenAPI Contract Sync Check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify OpenAPI TypeScript contract
        working-directory: frontend
        run: |
          test -s src/app/core/api/generated/openapi.types.ts
          if [ -f ../docs/architecture/openapi.yaml ]; then
            npm run api:generate
            git diff --exit-code -- src/app/core/api/
          fi
          npx tsc --noEmit -p tsconfig.app.json

  security-packages:
    name: Package Vulnerability Scan (NuGet & npm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Check vulnerable NuGet packages
        working-directory: backend
        run: |
          dotnet restore H2l.sln
          VULN_OUTPUT=$(dotnet list H2l.sln package --vulnerable --include-transitive)
          echo "$VULN_OUTPUT"
          if echo "$VULN_OUTPUT" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet packages detected."
            exit 1
          fi

      - name: Check vulnerable npm packages
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high

  security-trivy:
    name: Trivy Security Scan (FS & Config)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Trivy filesystem vulnerability & misconfiguration scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,misconfig,secret"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

  security-gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
